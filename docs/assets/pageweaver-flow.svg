<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960">
<rect width="1600" height="960" fill="#F6F7FA"/>
<text x="72" y="48" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" fill="#245FE8">PAGEWEAVER / SYSTEM MAP</text>
<text x="70" y="93" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="48" fill="#142237">把连续的图片，编织成一本 PDF</text>
<text x="73" y="172" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" fill="#526277">两个本地入口，共用一套编号、下载与图像处理逻辑。</text>
<text x="72" y="247" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#526277">01  INPUT</text>
<text x="526" y="247" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#526277">02  SHARED PIPELINE</text>
<text x="1184" y="247" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#526277">03  OUTPUT</text>
<rect x="70" y="288" width="330" height="180" rx="20" fill="#FFFFFF" stroke="#DCE2EC" stroke-width="2"/>
<text x="96" y="312" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#245FE8">COMMAND LINE</text>
<text x="96" y="350" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="29" fill="#142237">命令行任务</text>
<text x="96" y="398" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" fill="#526277">范围 / 重试 / 保留图片</text>
<rect x="70" y="506" width="330" height="180" rx="20" fill="#FFFFFF" stroke="#DCE2EC" stroke-width="2"/>
<text x="96" y="530" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#245FE8">LOCAL WEB :8080</text>
<text x="96" y="568" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="29" fill="#142237">浏览器操作</text>
<text x="96" y="616" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" fill="#526277">进度 / 缩略图 / 下载</text>
<rect x="520" y="288" width="535" height="398" rx="20" fill="#142237"/>
<text x="550" y="319" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#92B7FF">01</text>
<text x="600" y="315" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" fill="#FFFFFF">识别编号规则</text>
<text x="600" y="357" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" fill="#B8C8E0">前缀、补零位数、扩展名与查询串</text>
<text x="550" y="410" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#92B7FF">02</text>
<text x="600" y="406" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" fill="#FFFFFF">下载并验证响应</text>
<text x="600" y="448" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" fill="#B8C8E0">状态码 / 长度 / 图片解码 / 重试</text>
<text x="550" y="501" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#92B7FF">03</text>
<text x="600" y="497" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" fill="#FFFFFF">统一图像与可选还原</text>
<text x="600" y="539" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" fill="#B8C8E0">EXIF校正 / RGB / 横条排列恢复</text>
<text x="550" y="592" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#92B7FF">04</text>
<text x="600" y="588" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" fill="#FFFFFF">按编号保留页面</text>
<text x="600" y="630" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" fill="#B8C8E0">CLI临时PNG / Web内存PNG</text>
<rect x="1180" y="288" width="350" height="180" rx="20" fill="#FFFFFF" stroke="#DCE2EC" stroke-width="2"/>
<text x="1206" y="312" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#245FE8">PAGES / CLI + WEB</text>
<text x="1206" y="350" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="29" fill="#142237">多页 PDF</text>
<text x="1206" y="398" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" fill="#526277">每张图片对应一页</text>
<rect x="1180" y="506" width="350" height="180" rx="20" fill="#FFFFFF" stroke="#DCE2EC" stroke-width="2"/>
<text x="1206" y="530" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#245FE8">LONG PAGE / CLI</text>
<text x="1206" y="568" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="29" fill="#142237">长页 PDF</text>
<text x="1206" y="616" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" fill="#526277">统一宽度后纵向拼接</text>
