<text x="100" y="782" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#245FE8">LOCAL BY DESIGN</text>
<text x="100" y="823" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" fill="#142237">输入是有权访问的图片直链。无需模型 API Key；网页任务随服务重启清空。</text>
